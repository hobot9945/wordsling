[[subs_vec]]
key_phrases = ["."]
replacement = "."
modifier = "capitalize_next_word"

[[subs_vec]]
key_phrases = ["точка"]
replacement = "."
modifier = "suppress_whitespace_before_and_capitalize_next_word"

[[subs_vec]]
key_phrases = [
    "левая скобка",
    "скобка открывается",
    "left parenthesis",
    "open parenthesis",
]
replacement = "("
modifier = "suppress_whitespace_after"

[[subs_vec]]
key_phrases = [
    "правая скобка",
    "скобка закрывается",
    "right parenthesis",
    "close parenthesis",
]
replacement = ")"
modifier = "suppress_whitespace_before"

[[subs_vec]]
key_phrases = ["с большой буквы", "capitalize"]
replacement = ""
modifier = "capitalize_next_word"

[[subs_vec]]
key_phrases = ["с маленькой буквы", "lowercase"]
replacement = ""
modifier = "lowercase_next_word"

[[subs_vec]]
key_phrases = ["пробел", "space"]
replacement = " "
modifier = "suppress_whitespace_before"

[[subs_vec]]
key_phrases = ["убрать блок", "erase block"]
replacement = ""
modifier = "suppress_whitespace_before"

[[subs_vec]]
key_phrases = ["буквально", "literally"]
replacement = ""
modifier = "cancel_next_replacement"
